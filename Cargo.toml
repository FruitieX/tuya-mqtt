[package]
name = "tuya-mqtt"
version = "0.6.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
# Crypto dependencies (for tuyapi)
aes = "=0.8.4"
base64 = "=0.23.1"
ecb = "=0.1.2"
cipher = { version = "=0.4.4", features = ["alloc"] }
hmac = "=0.12.1"
inout = { version = "=0.1.4", features = ["block-padding", "std"] }
md5 = "=0.8.1"
sha2 = "=0.10.9"

# Parsing dependencies (for tuyapi)
hex = "=0.4.3"
nom = "=7.1.3"
num-derive = "=0.5.1"
num-traits = "=0.2.19"
once_cell = "=1.21.4"
thiserror = "=2.0.21"

# Main application dependencies
chrono = { version = "=0.4.45", features = ["serde"] }
env_logger = "=0.11.11"
tokio = { version = "=1.53.1", features = [
	"rt",
	"rt-multi-thread",
	"net",
	"time",
	"macros",
	"sync",
	"signal",
	"io-util",
] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.151", features = ["preserve_order"] }
rumqttc = "=0.25.1"
anyhow = "=1.0.104"
palette = { version = "=0.7.7", features = ["serializing"] }
log = "=0.4.34"
futures = "=0.3.34"
config = "=0.15.26"
rand = "=0.9.2"
